# Global confounders.
# Anything that moves traffic independently of a specific experiment goes here.
# evaluate.py flags any experiment whose measurement window overlaps an event
# with `invalidates: true` and downgrades its verdict to `confounded`.
#
# Log these as they happen. Reconstructing them six months later is guesswork.

events:
  - date_start: 2026-08-16
    date_end: 2026-08-16
    scope: all            # all | aicareer.me | data-mani.com
    invalidates: false
    label: Ledger initialised. No prior experiments are attributable.

