experiments:
  - id: EXP-2026-10-001
    site: aicareer.me
    created: 2026-10-19
    deployed: 2026-10-20
    status: live
    change_type: content_expansion
    hypothesis: 'The /hi-c/ page ranks top-5 for its head definitional terms (hi ic, high
      ic, hi-ic, pos ~4-6) but earns an impression-weighted position of ~8 overall and surfaces
      for a narrow query set, because it answers the "what is a HI-C" intent but not the
      adjacent "how does HI-C relate to IC levels (senior / staff / principal)" intent that
      the same searchers also issue. Adding two tightly-scoped FAQ entries covering that
      adjacent intent — and deferring the ladder detail to /guides/ic-career-ladder/ to avoid
      cannibalisation — will raise /hi-c/ impressions on the IC-leveling query cluster
      (query_filter: ic) by at least min_effect, by making the page eligible for that
      cluster without diluting the canonical definition.

      '
    treatment:
      - /hi-c/
    control: []
    primary_metric: impressions
    query_filter: ic
    baseline_window: 28
    settle_days: 21
    eval_window: 28
    min_effect: 0.3
    min_impressions: 150
    verdict: null
    result: null
    notes: "Named from the 2026-10 GSC analysis: the HI-C cluster is the site's emergent
      traction (impressions roughly doubled Aug->Oct, head terms in striking distance), while
      the AI-risk-calculator intent is stalled on page 3. Primary metric is impressions, not
      ctr/clicks: at ~0 baseline clicks those metrics are un-evaluable (relative lift divides
      by zero -> inconclusive by construction), and the hypothesis mechanism (new query
      coverage) maps to impressions, not position. Before/after only — there is no comparable
      control URL in the HI-C cluster, so this cannot separate the change from seasonality;
      evaluate.py flags this. query_filter is `ic` (not null): the validator requires a
      non-null filter to go live, and `ic` scopes the cohort to the IC-leveling queries the
      new content targets, on /hi-c/ traffic (which is HI-C-specific anyway, so noise is
      negligible). Expect inconclusive unless that filtered cohort clears the 150-impression
      floor by the eval window; floor left at 150 on purpose — lowering it to manufacture a
      verdict is exactly what the loop forbids. deployed = 2026-10-20, the real production
      date (merged and deployed via Actions->FTP; /hi-c/ confirmed live with the new FAQ).
      Replaces the 2026-08 homepage placeholder, which was a stand-in awaiting this analysis.

      "
