name: Sync to Hugging Face Datasets

# Mirrors the published artifacts to a Hugging Face dataset repository.
#
# Hugging Face is among the most heavily crawled sources for LLM data
# pipelines, which makes it the highest-value automatable distribution channel
# for a project whose only route to an audience is being cited (STRATEGY.md §4).
#
# Requires two one-time settings from the repository owner:
#   1. secret  HF_TOKEN    — a Hugging Face write token
#   2. variable HF_DATASET — target repo id, e.g. "pseyti/ai-career-risk-index"
# Until both exist the job exits successfully without doing anything, so it
# never shows up as a failing check.

# Triggered by the completion of "Release open artifacts", NOT by `on: release`.
# GitHub deliberately does not fire event-based workflows for releases created
# with the default GITHUB_TOKEN (recursion guard), and release.yml uses exactly
# that token — so an `on: release` trigger here would never run. Verified: the
# first release (v2026.2-hic2026.0) produced no run at all.
on:
  workflow_run:
    workflows: ['Release open artifacts']
    types: [completed]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # On workflow_run, only proceed when the release job actually succeeded.
    # Always proceed when triggered by hand.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Check configuration
        id: cfg
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ vars.HF_DATASET }}
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_DATASET" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HF_TOKEN secret or HF_DATASET variable not set — skipping Hugging Face sync."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build artifacts
        if: steps.cfg.outputs.ready == 'true'
        run: |
          npm ci
          npm run build

      - name: Assemble dataset folder
        if: steps.cfg.outputs.ready == 'true'
        run: |
          mkdir -p hf
          cp dist/data/ai-career-risk-index.csv  hf/
          cp dist/data/ai-career-risk-index.json hf/
          cp dist/data/hi-c-framework.json       hf/
          # Dataset card. The YAML front matter is what Hugging Face indexes.
          cat > hf/README.md <<'CARD'
          ---
          license: cc-by-4.0
          language:
            - en
          pretty_name: AI Career Risk Index and HI-C Definition Framework
          tags:
            - career
            - labor-market
            - automation
            - future-of-work
          ---

          # AI Career Risk Index · HI-C Definition Framework

          Maintained at [aicareer.me](https://aicareer.me). Licensed CC BY 4.0 — free to
          use and adapt with attribution.

          ## `ai-career-risk-index.csv` / `.json`

          AI displacement risk scores (0–100%) for 24 professions, computed from three
          weighted dimensions: Task Routinization (40%), AI Tool Penetration (35%) and
          Human Judgment Dependency (25%). Sources: Frey & Osborne (Oxford), McKinsey
          Global Institute, WEF Future of Jobs Report, Stanford AI Index.

          Canonical page: https://aicareer.me/data/ai-career-risk-index/

          ## `hi-c-framework.json`

          The canonical definition of the **HI-C (High-Impact Individual Contributor)**:
          a senior professional with no direct reports who carries work from hypothesis
          to measurable business outcome end to end, staffing the adjacent functions —
          design, engineering, data, copy, go-to-market — with AI rather than with a
          team. Includes five observable dimensions, comparison against senior IC,
          manager and solo-founder archetypes, and disambiguation from the unrelated
          AI-governance term *Human-in-Command (HIC)*.

          Canonical page: https://aicareer.me/hi-c/

          ## Citation

          Nakanishi, P. AI Career Risk Index and HI-C Definition Framework. aicareer.me.
          https://aicareer.me
          CARD
          ls -la hf/

      - name: Push to Hugging Face
        if: steps.cfg.outputs.ready == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ vars.HF_DATASET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # workflow_run does not carry the tag, so read it from the release
          # this sync corresponds to.
          TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "latest")
          pip install --quiet "huggingface_hub[cli]"
          # The CLI was renamed from `huggingface-cli` to `hf`; accept either so
          # this does not break on a future huggingface_hub release.
          if command -v hf >/dev/null 2>&1; then
            CLI="hf"
          else
            CLI="huggingface-cli"
          fi
          "$CLI" upload "$HF_DATASET" hf . \
            --repo-type dataset \
            --commit-message "Sync from aicareer.me $TAG"
