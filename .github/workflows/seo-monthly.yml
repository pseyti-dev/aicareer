name: Monthly SEO evaluation

on:
  schedule:
    - cron: "0 7 1 * *"      # 1st of the month, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client google-auth pandas pyarrow pyyaml
      - run: python seo/fetch_gsc.py
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      - run: python seo/evaluate.py
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: seo/evaluation-${{ github.run_number }}
          title: "SEO evaluation — $(date +%Y-%m)"
          body: |
            Automated verdicts for experiments whose measurement window closed.
            Review `seo/reports/` before merging.
          commit-message: "chore(seo): monthly evaluation"
          add-paths: |
            seo/ledger.yaml
            seo/reports/
            data/gsc/
