name: GSC pull

on:
  schedule:
    - cron: "0 6 * * 1"      # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client google-auth pandas pyarrow
      - run: python seo/fetch_gsc.py
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      - name: Commit
        run: |
          git config user.name  "gsc-bot"
          git config user.email "gsc-bot@users.noreply.github.com"
          git add data/gsc
          git diff --staged --quiet || git commit -m "chore(gsc): weekly pull $(date -I)"
          git push
